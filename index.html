<!-- Updated version of index.html with interactivity enhancements -->
<!-- Key features added: Theme toggle, Chart.js skill chart, AOS scroll animations, and Contact form -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul Vadakkiniyil</title>

  <!-- Existing Stylesheets -->
  <link rel="stylesheet" href="./assets/css/bootstrap.css" />
  <link rel="stylesheet" href="./assets/vendor/aos/aos.css" />

  <style>
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }
    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Theme Toggle -->
  <button class="btn btn-dark theme-toggle">Toggle Theme</button>

  <!-- Hero Section with AOS -->
  <section class="text-center py-5" data-aos="fade-down">
    <h1>I'm <b>Rahul Vadakkiniyil</b></h1>
    <p class="lead">Cloud Engineer</p>
  </section>

  <!-- Skill Chart -->
  <section class="container my-5" data-aos="fade-up">
    <h2 class="text-center mb-4">Skills Overview</h2>
    <canvas id="skillsChart" height="200"></canvas>
  </section>

  <!-- Contact Form -->
  <section class="container my-5" data-aos="fade-up">
    <h2 class="text-center mb-4">Contact Me</h2>
    <form action="https://formspree.io/f/mknldjzj" method="POST">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required />
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </section>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./assets/vendor/aos/aos.js"></script>
  <script>
    AOS.init();

    // Theme Toggle
    const toggleBtn = document.querySelector('.theme-toggle');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });

    // Skill Chart
    const ctx = document.getElementById('skillsChart').getContext('2d');
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['AWS', 'Azure', 'Terraform', 'GitHub', 'Python', 'Docker', 'Monitoring', 'Linux'],
        datasets: [{
          label: 'Skill Proficiency',
          data: [86, 80, 50, 60, 40, 60, 55, 70],
          backgroundColor: 'rgba(54, 162, 235, 0.2)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          r: {
            angleLines: { display: true },
            suggestedMin: 0,
            suggestedMax: 100
          }
        }
      }
    });
  </script>
</body>
</html>
